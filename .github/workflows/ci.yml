name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Converter regression (3 fixtures + self-hosting consistency)
        run: python tests/ci_check.py

      - name: Behavior regression (round-trip + interference, heuristic)
        run: python tests/behavior_regression.py

      - name: Publish index (multi-platform version sync check)
        run: python tools/publish_index.py --check
